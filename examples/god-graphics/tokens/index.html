<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf2f8}
:root{--ink:#eaf2f8;--dim:#8aa3b6;--lab:#5f8fa8;--teal:#5eead4;--amber:#e0a860;--red:#f4636e;--violet:#9b8cf0;--green:#3ecf8e;
 --card:rgba(17,26,42,.82);--line:rgba(120,165,195,.24)}
#stage{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(1200px 820px at 12% 92%,rgba(18,86,92,.55),transparent 62%),
 radial-gradient(1100px 800px at 92% 4%,rgba(74,54,126,.52),transparent 62%),
 linear-gradient(160deg,#0a0f1b 0%,#080c15 55%,#070a12 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,165,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,165,195,.06) 1px,transparent 1px);background-size:60px 60px}
.lab{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--lab);font-weight:800}
.h1{font-size:96px;font-weight:900;letter-spacing:-.025em;line-height:1.02;color:#fff}
.h2{font-size:64px;font-weight:850;letter-spacing:-.015em;line-height:1.08;color:#fff}
.mono{font-family:Consolas,"JetBrains Mono",monospace}
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:16px;background:rgba(22,34,52,.92);
 border:1.5px solid var(--line);font-size:35px;font-weight:700;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.abs{position:absolute}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.glow{text-shadow:0 0 50px rgba(94,234,212,.45)}
section.clip.shift{transform:translateY(110px)}
</style></head><body>
<div id="root" data-composition-id="tokens" data-start="0" data-duration="18.35" data-width="1920" data-height="1080">
<div id="stage"><div class="grid"></div>
<section class="clip shift" data-start="0" data-duration="18.35" style="position:absolute;inset:0">

<div class="abs" id="t" style="left:120px;top:100px"><div class="lab">A platform to get stuff done</div><div class="h1" style="margin-top:12px">No token<br/><span style="color:var(--teal)">drama.</span></div></div>
<div class="card" id="m" style="left:900px;top:150px;width:800px;padding:40px 44px">
 <div style="display:flex;justify-content:space-between"><div class="lab">Your token limit</div><div class="lab" style="color:#5f8fa8">elsewhere</div></div>
 <div style="margin-top:30px;font-size:30px;font-weight:700">Today</div>
 <div style="height:34px;border-radius:12px;background:rgba(150,190,215,.12);margin-top:10px;overflow:hidden"><div id="b1" style="height:100%;width:100%;background:#5eead4"></div></div>
 <div style="margin-top:30px;font-size:30px;font-weight:700" id="tmr">Tomorrow</div>
 <div style="height:34px;border-radius:12px;background:rgba(150,190,215,.12);margin-top:10px;overflow:hidden"><div id="b2" style="height:100%;width:100%;background:#5eead4"></div></div>
 <div class="mono" id="pct" style="margin-top:14px;font-size:30px;color:#f4636e;font-weight:800">100%</div>
</div>
<div class="card" id="not" style="left:900px;top:640px;width:560px;padding:28px 36px;border-color:rgba(94,234,212,.7);box-shadow:0 0 40px rgba(94,234,212,.3)">
 <div style="font-size:42px;font-weight:900">Not on myHermes.</div></div>

</section></div></div>
<script>
window.__timelines = window.__timelines || {};
const S=id=>document.getElementById(id);
function el(t,c,s,h){const e=document.createElement(t);if(c)e.className=c;if(s)e.setAttribute('style',s);if(h!=null)e.innerHTML=h;return e;}
const NS="http://www.w3.org/2000/svg";function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const fmt=n=>Math.round(n).toLocaleString("en-US");
const tl=gsap.timeline({paused:true});
const pop=(t,at,o)=>tl.from(t,Object.assign({opacity:0,scale:.7,y:30,duration:.45,ease:"back.out(2.2)"},o||{}),at);
const rise=(t,at,o)=>tl.from(t,Object.assign({opacity:0,y:40,duration:.55,ease:"power3.out"},o||{}),at);
tl.from("#stage",{opacity:0,duration:.25},0);

rise('#t',.3);tl.from('#t .h1',{opacity:0,scale:.85,duration:.5,ease:'back.out(2)'},5.8);
rise('#m',4.6);tl.from('#b1',{scaleX:0,transformOrigin:'0 50%',duration:.7},5.0);tl.from('#b2',{scaleX:0,transformOrigin:'0 50%',duration:.7},5.2);
tl.to('#b2',{width:'60%',backgroundColor:'#f4636e',duration:.8,ease:'power3.inOut'},11.0);
tl.to({n:100},{n:60,duration:.8,ease:'power3.inOut',onUpdate:function(){S('pct').textContent=Math.round(this.targets()[0].n)+'% of today'}},11.0);
tl.set('#pct',{opacity:0},0);tl.to('#pct',{opacity:1,duration:.2},11.0);
pop('#not',13.4,{scale:.8});

tl.to("#stage",{opacity:1,duration:18.35},0);
window.__timelines["tokens"]=tl;
</script></body></html>
