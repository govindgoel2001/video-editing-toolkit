<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf2f8}
:root{--ink:#eaf2f8;--dim:#8aa3b6;--lab:#5f8fa8;--teal:#5eead4;--amber:#e0a860;--red:#f4636e;--violet:#9b8cf0;--green:#3ecf8e;
 --card:rgba(17,26,42,.82);--line:rgba(120,165,195,.24)}
#stage{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(1200px 820px at 12% 92%,rgba(18,86,92,.55),transparent 62%),
 radial-gradient(1100px 800px at 92% 4%,rgba(74,54,126,.52),transparent 62%),
 linear-gradient(160deg,#0a0f1b 0%,#080c15 55%,#070a12 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,165,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,165,195,.06) 1px,transparent 1px);background-size:60px 60px}
.lab{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--lab);font-weight:800}
.h1{font-size:96px;font-weight:900;letter-spacing:-.025em;line-height:1.02;color:#fff}
.h2{font-size:64px;font-weight:850;letter-spacing:-.015em;line-height:1.08;color:#fff}
.mono{font-family:Consolas,"JetBrains Mono",monospace}
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:16px;background:rgba(22,34,52,.92);
 border:1.5px solid var(--line);font-size:35px;font-weight:700;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.abs{position:absolute}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.glow{text-shadow:0 0 50px rgba(94,234,212,.45)}
section.clip.shift{transform:translateY(110px)}
</style></head><body>
<div id="root" data-composition-id="private" data-start="0" data-duration="20.24" data-width="1920" data-height="1080">
<div id="stage"><div class="grid"></div>
<section class="clip shift" data-start="0" data-duration="20.24" style="position:absolute;inset:0">

<div class="abs" id="t" style="left:120px;top:100px"><div class="lab">A harness that runs itself</div><div class="h2" style="margin-top:12px">Automated, on your<br/>own machine.</div></div>
<div id="ticks" class="abs" style="left:120px;top:400px;display:flex;gap:16px"></div>
<div class="card" id="vm" style="left:120px;top:560px;width:640px;padding:34px 38px;border-color:rgba(94,234,212,.5)">
 <div class="lab" style="color:var(--teal)">Your virtual machine</div>
 <div style="font-size:38px;font-weight:800;margin-top:12px;color:#fff">Your own personal server</div>
 <div style="height:10px;border-radius:5px;background:rgba(150,190,215,.15);margin-top:20px;overflow:hidden"><div id="cpu" style="height:100%;width:62%;background:linear-gradient(90deg,#5eead4,#9b8cf0)"></div></div>
</div>
<div id="list" class="abs" style="left:880px;top:240px;display:flex;flex-direction:column;gap:18px"></div>

</section></div></div>
<script>
window.__timelines = window.__timelines || {};
const S=id=>document.getElementById(id);
function el(t,c,s,h){const e=document.createElement(t);if(c)e.className=c;if(s)e.setAttribute('style',s);if(h!=null)e.innerHTML=h;return e;}
const NS="http://www.w3.org/2000/svg";function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const fmt=n=>Math.round(n).toLocaleString("en-US");
const tl=gsap.timeline({paused:true});
const pop=(t,at,o)=>tl.from(t,Object.assign({opacity:0,scale:.7,y:30,duration:.45,ease:"back.out(2.2)"},o||{}),at);
const rise=(t,at,o)=>tl.from(t,Object.assign({opacity:0,y:40,duration:.55,ease:"power3.out"},o||{}),at);
tl.from("#stage",{opacity:0,duration:.25},0);

rise('#t',.2);
const T=['08:00','12:00','18:00','21:00'].map(x=>{const c=el('div','chip','font-size:26px;padding:12px 20px');c.appendChild(el('div','dot','background:#5eead4'));c.appendChild(el('span','mono',null,x));S('ticks').appendChild(c);return c;});
T.forEach((c,i)=>pop(c,6.2+i*.3));
pop('#vm',9.3);tl.from('#cpu',{scaleX:0,transformOrigin:'0 50%',duration:1.2,ease:'power2.out'},9.6);
const it=[["Your data stays private","#5eead4",11.6],["No training on your data","#e0a860",13.0],["Full privacy","#9b8cf0",15.4]];
it.forEach(x=>{const c=el('div','card','position:relative;width:570px;padding:26px 32px;display:flex;align-items:center;gap:22px;border-color:'+x[1]+'88');
 c.appendChild(el('div','','width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#08121c;background:'+x[1],'&#10003;'));
 c.appendChild(el('div','','font-size:36px;font-weight:800',x[0]));S('list').appendChild(c);pop(c,x[2],{x:60});});

tl.to("#stage",{opacity:1,duration:20.24},0);
window.__timelines["private"]=tl;
</script></body></html>
