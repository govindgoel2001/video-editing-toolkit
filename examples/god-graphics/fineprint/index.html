<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf2f8}
:root{--ink:#eaf2f8;--dim:#8aa3b6;--lab:#5f8fa8;--teal:#5eead4;--amber:#e0a860;--red:#f4636e;--violet:#9b8cf0;--green:#3ecf8e;
 --card:rgba(17,26,42,.82);--line:rgba(120,165,195,.24)}
#stage{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(1200px 820px at 12% 92%,rgba(18,86,92,.55),transparent 62%),
 radial-gradient(1100px 800px at 92% 4%,rgba(74,54,126,.52),transparent 62%),
 linear-gradient(160deg,#0a0f1b 0%,#080c15 55%,#070a12 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,165,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,165,195,.06) 1px,transparent 1px);background-size:60px 60px}
.lab{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--lab);font-weight:800}
.h1{font-size:96px;font-weight:900;letter-spacing:-.025em;line-height:1.02;color:#fff}
.h2{font-size:64px;font-weight:850;letter-spacing:-.015em;line-height:1.08;color:#fff}
.mono{font-family:Consolas,"JetBrains Mono",monospace}
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:16px;background:rgba(22,34,52,.92);
 border:1.5px solid var(--line);font-size:35px;font-weight:700;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.abs{position:absolute}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.glow{text-shadow:0 0 50px rgba(94,234,212,.45)}
section.clip.shift{transform:translateY(110px)}
</style></head><body>
<div id="root" data-composition-id="fineprint" data-start="0" data-duration="6.78" data-width="1920" data-height="1080">
<div id="stage"><div class="grid"></div>
<section class="clip shift" data-start="0" data-duration="6.78" style="position:absolute;inset:0">

<div class="abs" id="t" style="left:120px;top:80px"><div class="lab">What they should at least say</div><div class="h2" style="margin-top:12px">Put it on the<br/>landing page.</div></div>
<div class="card" id="pg" style="left:820px;top:60px;width:700px;height:520px;overflow:hidden;padding:0">
 <div style="height:46px;background:rgba(30,44,66,.95);display:flex;align-items:center;gap:10px;padding:0 18px">
  <div class="dot" style="background:#f4636e;width:12px;height:12px"></div><div class="dot" style="background:#e0a860;width:12px;height:12px"></div><div class="dot" style="background:#3ecf8e;width:12px;height:12px"></div>
  <div class="mono" style="margin-left:14px;font-size:18px;color:#8aa3b6">landing page</div></div>
 <div style="padding:34px 38px">
  <div style="height:26px;width:62%;border-radius:8px;background:rgba(150,190,215,.25)"></div>
  <div style="height:16px;width:88%;border-radius:6px;background:rgba(150,190,215,.12);margin-top:18px"></div>
  <div style="height:16px;width:74%;border-radius:6px;background:rgba(150,190,215,.12);margin-top:10px"></div>
  <div style="height:60px;width:200px;border-radius:14px;background:rgba(94,234,212,.35);margin-top:30px"></div>
  <div id="ban" style="margin-top:44px;padding:22px 24px;border-radius:14px;background:rgba(224,168,96,.14);border:2px solid #e0a860">
   <div class="lab" style="color:#e0a860;font-size:18px">Heads up</div>
   <div id="msg" style="font-size:30px;font-weight:800;margin-top:8px;color:#fff;min-height:80px"></div></div>
 </div></div>

</section></div></div>
<script>
window.__timelines = window.__timelines || {};
const S=id=>document.getElementById(id);
function el(t,c,s,h){const e=document.createElement(t);if(c)e.className=c;if(s)e.setAttribute('style',s);if(h!=null)e.innerHTML=h;return e;}
const NS="http://www.w3.org/2000/svg";function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const fmt=n=>Math.round(n).toLocaleString("en-US");
const tl=gsap.timeline({paused:true});
const pop=(t,at,o)=>tl.from(t,Object.assign({opacity:0,scale:.7,y:30,duration:.45,ease:"back.out(2.2)"},o||{}),at);
const rise=(t,at,o)=>tl.from(t,Object.assign({opacity:0,y:40,duration:.55,ease:"power3.out"},o||{}),at);
tl.from("#stage",{opacity:0,duration:.25},0);

rise('#t',.3);pop('#pg',1.4,{scale:.85});
pop('#ban',2.8,{scale:.9});
const txt="Hey, I'm gonna use your data to train my AI model.";
const m=S('msg');const sp=[...txt].map(ch=>{const s=el('span','',null,ch);m.appendChild(s);return s;});
tl.from(sp,{opacity:0,duration:.01,stagger:.045},3.6);
tl.to('#ban',{boxShadow:'0 0 40px rgba(224,168,96,.55)',duration:.4,yoyo:true,repeat:1},6.0);

tl.to("#stage",{opacity:1,duration:6.78},0);
window.__timelines["fineprint"]=tl;
</script></body></html>
