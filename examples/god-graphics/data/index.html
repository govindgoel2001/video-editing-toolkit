<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf2f8}
:root{--ink:#eaf2f8;--dim:#8aa3b6;--lab:#5f8fa8;--teal:#5eead4;--amber:#e0a860;--red:#f4636e;--violet:#9b8cf0;--green:#3ecf8e;
 --card:rgba(17,26,42,.82);--line:rgba(120,165,195,.24)}
#stage{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(1200px 820px at 12% 92%,rgba(18,86,92,.55),transparent 62%),
 radial-gradient(1100px 800px at 92% 4%,rgba(74,54,126,.52),transparent 62%),
 linear-gradient(160deg,#0a0f1b 0%,#080c15 55%,#070a12 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,165,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,165,195,.06) 1px,transparent 1px);background-size:60px 60px}
.lab{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--lab);font-weight:800}
.h1{font-size:96px;font-weight:900;letter-spacing:-.025em;line-height:1.02;color:#fff}
.h2{font-size:64px;font-weight:850;letter-spacing:-.015em;line-height:1.08;color:#fff}
.mono{font-family:Consolas,"JetBrains Mono",monospace}
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:16px;background:rgba(22,34,52,.92);
 border:1.5px solid var(--line);font-size:35px;font-weight:700;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.abs{position:absolute}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.glow{text-shadow:0 0 50px rgba(94,234,212,.45)}
section.clip.shift{transform:translateY(110px)}
</style></head><body>
<div id="root" data-composition-id="data" data-start="0" data-duration="16.41" data-width="1920" data-height="1080">
<div id="stage"><div class="grid"></div>
<section class="clip shift" data-start="0" data-duration="16.41" style="position:absolute;inset:0">

<div class="card" id="a" style="left:120px;top:160px;width:760px;padding:48px 50px;border-color:rgba(244,99,110,.6);background:rgba(46,15,22,.82)">
 <div class="lab" style="color:var(--red)">Frontier labs</div>
 <div class="h2" style="margin-top:14px">A ton of your data.</div>
 <div style="font-size:36px;color:#ffd0d5;margin-top:18px;line-height:1.35" id="a2">Taken forcefully.<br/>They never told you.</div></div>
<div class="card" id="b" style="left:960px;top:160px;width:760px;padding:48px 50px;border-color:rgba(94,234,212,.6);box-shadow:0 0 50px rgba(94,234,212,.25)">
 <div class="lab" style="color:var(--teal)">myHermes</div>
 <div class="h2" style="margin-top:14px">You tell me.</div>
 <div style="font-size:36px;color:#c9eee6;margin-top:18px;line-height:1.35" id="b2">A direct, one-to-one<br/>conversation.</div></div>
<div class="abs" id="vs" style="left:880px;top:330px;width:80px;text-align:center;font-size:40px;font-weight:900;color:#5f8fa8">vs</div>

</section></div></div>
<script>
window.__timelines = window.__timelines || {};
const S=id=>document.getElementById(id);
function el(t,c,s,h){const e=document.createElement(t);if(c)e.className=c;if(s)e.setAttribute('style',s);if(h!=null)e.innerHTML=h;return e;}
const NS="http://www.w3.org/2000/svg";function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const fmt=n=>Math.round(n).toLocaleString("en-US");
const tl=gsap.timeline({paused:true});
const pop=(t,at,o)=>tl.from(t,Object.assign({opacity:0,scale:.7,y:30,duration:.45,ease:"back.out(2.2)"},o||{}),at);
const rise=(t,at,o)=>tl.from(t,Object.assign({opacity:0,y:40,duration:.55,ease:"power3.out"},o||{}),at);
tl.from("#stage",{opacity:0,duration:.25},0);

pop('#a',2.0,{x:-60,scale:.9});rise('#a2',7.4);
tl.from('#vs',{opacity:0,duration:.4},10.0);
pop('#b',10.2,{x:60,scale:.9});rise('#b2',12.6);

tl.to("#stage",{opacity:1,duration:16.41},0);
window.__timelines["data"]=tl;
</script></body></html>
