<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf2f8}
:root{--ink:#eaf2f8;--dim:#8aa3b6;--lab:#5f8fa8;--teal:#5eead4;--amber:#e0a860;--red:#f4636e;--violet:#9b8cf0;--green:#3ecf8e;
 --card:rgba(17,26,42,.82);--line:rgba(120,165,195,.24)}
#stage{position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(1200px 820px at 12% 92%,rgba(18,86,92,.55),transparent 62%),
 radial-gradient(1100px 800px at 92% 4%,rgba(74,54,126,.52),transparent 62%),
 linear-gradient(160deg,#0a0f1b 0%,#080c15 55%,#070a12 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,165,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,165,195,.06) 1px,transparent 1px);background-size:60px 60px}
.lab{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--lab);font-weight:800}
.h1{font-size:96px;font-weight:900;letter-spacing:-.025em;line-height:1.02;color:#fff}
.h2{font-size:64px;font-weight:850;letter-spacing:-.015em;line-height:1.08;color:#fff}
.mono{font-family:Consolas,"JetBrains Mono",monospace}
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border-radius:16px;background:rgba(22,34,52,.92);
 border:1.5px solid var(--line);font-size:35px;font-weight:700;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.abs{position:absolute}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.glow{text-shadow:0 0 50px rgba(94,234,212,.45)}
section.clip.shift{transform:translateY(110px)}
</style></head><body>
<div id="root" data-composition-id="harness" data-start="0" data-duration="21.0" data-width="1920" data-height="1080">
<div id="stage"><div class="grid"></div>
<section class="clip shift" data-start="0" data-duration="21.0" style="position:absolute;inset:0">

<div class="abs" id="h" style="left:120px;top:100px"><div class="lab">For the newbies</div><div class="h1" style="margin-top:14px">What's a<br/><span style="color:var(--teal)">harness?</span></div></div>
<div class="abs" id="def" style="left:120px;top:440px;width:640px"><div style="font-size:40px;line-height:1.35;color:#c9dcea">The infrastructure,<br/>the <b style="color:#fff">anatomy of an LLM.</b></div></div>
<svg><circle id="ring" cx="1170" cy="470" r="300" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="14 12" stroke-opacity=".8"/>
 <g id="spokes"></g></svg>
<div class="abs" id="ringlab" style="left:1050px;top:85px;width:240px;text-align:center"><div class="lab" style="color:var(--teal);font-size:26px">Harness</div></div>
<div class="card" id="core" style="left:1050px;top:390px;width:240px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-color:rgba(155,140,240,.7);box-shadow:0 0 50px rgba(155,140,240,.45)">
 <div style="font-size:60px;font-weight:900">LLM</div><div class="mono" style="font-size:20px;color:#a9c4dd">the model itself</div></div>
<div class="card" id="tools" style="left:830px;top:180px;width:250px;padding:24px;text-align:center"><div class="dot" style="background:#e0a860;margin:0 auto 12px"></div><div style="font-size:36px;font-weight:800">Tools</div></div>
<div class="card" id="mem" style="left:1290px;top:180px;width:250px;padding:24px;text-align:center"><div class="dot" style="background:#5eead4;margin:0 auto 12px"></div><div style="font-size:36px;font-weight:800">Memory</div></div>

</section></div></div>
<script>
window.__timelines = window.__timelines || {};
const S=id=>document.getElementById(id);
function el(t,c,s,h){const e=document.createElement(t);if(c)e.className=c;if(s)e.setAttribute('style',s);if(h!=null)e.innerHTML=h;return e;}
const NS="http://www.w3.org/2000/svg";function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const fmt=n=>Math.round(n).toLocaleString("en-US");
const tl=gsap.timeline({paused:true});
const pop=(t,at,o)=>tl.from(t,Object.assign({opacity:0,scale:.7,y:30,duration:.45,ease:"back.out(2.2)"},o||{}),at);
const rise=(t,at,o)=>tl.from(t,Object.assign({opacity:0,y:40,duration:.55,ease:"power3.out"},o||{}),at);
tl.from("#stage",{opacity:0,duration:.25},0);

rise('#h',.6);rise('#def',5.6);
const sp=[[955,260],[1415,260]].map(p=>{const l=sv('line',{x1:1170,y1:470,x2:p[0],y2:p[1],stroke:'rgba(150,190,215,.45)','stroke-width':3});S('spokes').appendChild(l);return l;});
pop('#core',9.2,{scale:.6});
pop('#tools',11.3);tl.from(sp[0],{opacity:0,duration:.4},11.5);
pop('#mem',12.9);tl.from(sp[1],{opacity:0,duration:.4},13.1);
tl.to('#core',{scale:1.08,duration:.35,yoyo:true,repeat:3,ease:'sine.inOut'},17.2);
tl.from('#ring',{opacity:0,scale:.6,transformOrigin:'1170px 470px',duration:.8,ease:'power3.out'},18.8);
rise('#ringlab',19.2,{y:-20});
tl.to('#ring',{rotation:30,transformOrigin:'1170px 470px',duration:2.5,ease:'none'},18.8);

tl.to("#stage",{opacity:1,duration:21.0},0);
window.__timelines["harness"]=tl;
</script></body></html>
