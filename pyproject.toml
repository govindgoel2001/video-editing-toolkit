[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "govind-video-editing-toolkit"
version = "1.0.0"
description = "The video-use, FFmpeg and HyperFrames workflow from Govind's editing sessions"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "Pillow==12.2.0",
  "faster-whisper==1.2.1",
]

[project.optional-dependencies]
video-use = ["requests>=2.32,<3", "librosa>=0.11,<0.12", "matplotlib>=3.10,<4"]
capture = ["playwright==1.62.0"]
download = ["yt-dlp==2026.7.4"]
manim = ["manim>=0.19,<0.21"]

[tool.setuptools]
py-modules = []
